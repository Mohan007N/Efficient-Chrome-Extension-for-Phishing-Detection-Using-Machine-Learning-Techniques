name: WebShield AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: pytest -v tests/

      - name: Verify Chrome extension JSON & JS syntax + utils
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          python -m json.tool chrome_extension/manifest.json > /dev/null
          node --check chrome_extension/utils.js
          node --check chrome_extension/content.js
          node --check chrome_extension/background.js
          node --check chrome_extension/popup.js

      - name: Build Docker image
        run: docker build -t webshield-api:ci .
