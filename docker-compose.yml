services:
  api:
    build: .
    container_name: webshield-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - DOCKER_ENV=1
    volumes:
      - ./models:/app/models
      - ./dataset:/app/dataset
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: webshield-mlflow
    profiles: ["mlops"]
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      sh -c "pip install --no-cache-dir mlflow>=2.14.0 &&
             mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/mlruns/mlflow.db"
